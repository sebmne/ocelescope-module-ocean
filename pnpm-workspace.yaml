packages:
  - app
  - frontend-modules/*
# This template intentionally installs freshly-published @ocelescope packages,
# so it opts out of pnpm's minimum-release-age cooldown. Remove this line if you
# prefer to wait out your global cooldown for newly published dependencies.
minimumReleaseAge: 0
allowBuilds:
  core-js: true
  es5-ext: true
  esbuild: true
  sharp: true

# Single source of truth for shared dependency versions. Packages reference
# these with `"<name>": "catalog:"`, so bumping Ocelescope (or React, Mantine,
# ...) is a one-line change here. The app and every module MUST resolve the
# same React, Mantine and @ocelescope/core; two copies break hooks at runtime.
catalog:
  # Ocelescope
  "@ocelescope/api-base": ^0.10.1
  "@ocelescope/api-client": ^0.10.1
  "@ocelescope/api-config": ^0.10.1
  "@ocelescope/core": ^0.10.1
  "@ocelescope/management": ^0.10.1
  "@ocelescope/resources": ^0.10.1
  # UI
  "@mantine/core": ^9.6.2
  "@mantine/hooks": ^9.6.2
  "@mantine/dates": ^9.6.2
  "@mantine/charts": ^9.6.2
  "@mantine/dropzone": ^9.6.2
  "@mantine/notifications": ^9.6.2
  mantine-datatable: ^9.4.0
  "@xyflow/react": ^12.10.1
  "@r4pm/components": ^0.3.2
  lucide-react: ^1.47.0
  "@lucide/lab": ^0.7.0
  # React & data fetching
  next: 16.3.8
  react: ^19.3.0
  react-dom: ^19.3.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.2.3
  "@tanstack/react-query": ^5.103.2
  axios: ^1.20.0
  # Tooling
  "@biomejs/biome": ^2.5.14
  dependency-cruiser: ^18.4.0
  orval: ^8.36.0
  tsdown: ^0.22.14
  typescript: ^5.9.3

# Unreleased: the branch feat/ocel-extensions of promi4s/ocelescope (0.10.1 plus
# OCEL extensions, the new pickers and charts). The packages that differ from the
# published 0.10.1, packed from a checkout of the branch at 78e3624 (unchanged up to 329e57c) with
# `pnpm pack` (see vendor/ocelescope/README.md). Remove once a release includes them.
overrides:
  "@ocelescope/core": file:./vendor/ocelescope/ocelescope-core-0.10.1.tgz
  "@ocelescope/api-base": file:./vendor/ocelescope/ocelescope-api-base-0.10.1.tgz
  "@ocelescope/management": file:./vendor/ocelescope/ocelescope-management-0.10.1.tgz
  "@ocelescope/resources": file:./vendor/ocelescope/ocelescope-resources-0.10.1.tgz
