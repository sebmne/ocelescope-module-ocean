[project]
name = "ocelescope-module-socel"
version = "0.1.0"
description = "sOCEL: sustainability analysis of object-centric event logs for Ocelescope"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28",
  "ocelescope-backend>=0.10.1,<0.11.0",
  "pydantic>=2.11",
]

[project.entry-points."ocelescope_backend.modules"]
socelV1 = "ocelescope_module_socel.module:Socel"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
# The READMEs align their code comments by hand.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
# The tests import their helpers (api.py, example_log.py) by module name, as pytest runs them.
extraPaths = ["src", "tests"]
typeCheckingMode = "standard"

# The architecture, enforced: `pnpm run check:backend` (repository root) runs these contracts.
# One hexagon for the whole module - pages are the frontend's concern - with
# dependencies pointing inwards: module -> api -> infrastructure -> application -> domain.
# Routes obtain assembled use cases from api/dependencies.py.
[tool.importlinter]
root_package = "ocelescope_module_socel"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: module -> api -> infrastructure -> application -> domain"
type = "layers"
layers = [
  "ocelescope_module_socel.module",
  "ocelescope_module_socel.api",
  "(ocelescope_module_socel.infrastructure)",
  "ocelescope_module_socel.application",
  "ocelescope_module_socel.domain",
]

[[tool.importlinter.contracts]]
name = "Routes reach adapters only through the composition root (api/dependencies.py)"
type = "forbidden"
source_modules = ["ocelescope_module_socel.api.routes", "ocelescope_module_socel.api.router"]
forbidden_modules = ["ocelescope_module_socel.infrastructure"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Application and domain know no database, host, web framework or legacy library"
type = "forbidden"
source_modules = ["ocelescope_module_socel.application", "ocelescope_module_socel.domain"]
forbidden_modules = ["fastapi", "ocelescope", "ocelescope_backend", "duckdb", "socel"]

[[tool.importlinter.contracts]]
name = "Domain has no dependency on application, including its ports"
type = "forbidden"
source_modules = ["ocelescope_module_socel.domain"]
forbidden_modules = ["ocelescope_module_socel.application"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.importlinter.contracts]]
name = "Backend has no dependency on the standalone sOCEL library"
type = "forbidden"
source_modules = ["ocelescope_module_socel"]
forbidden_modules = ["socel"]
