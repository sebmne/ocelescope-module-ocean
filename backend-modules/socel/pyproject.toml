[project]
name = "ocelescope-module-socel"
version = "0.1.0"
description = "sOCEL: sustainability analysis of object-centric event logs for Ocelescope"
requires-python = ">=3.13"
dependencies = [
  "ocelescope-backend>=0.10.1,<0.11.0",
  "pydantic>=2.11",
  "socel",
]

[project.entry-points."ocelescope_backend.modules"]
socelV1 = "ocelescope_module_socel.module:Socel"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
# The READMEs align their code comments by hand.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

# The architecture, enforced: `pnpm run check:backend` (repository root) runs these contracts.
# One hexagon for the whole module - pages are the frontend's concern - with
# dependencies pointing inwards: module -> api -> infrastructure -> application -> domain.
# There is no infrastructure yet (no use case needs anything from outside), so the
# layer is optional - the parentheses. With the first adapter, add a contract that
# keeps api/routes from importing infrastructure: routes get use cases, with their
# adapters, from api/dependencies.py only.
[tool.importlinter]
root_package = "ocelescope_module_socel"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: module -> api -> infrastructure -> application -> domain"
type = "layers"
layers = [
  "ocelescope_module_socel.module",
  "ocelescope_module_socel.api",
  "(ocelescope_module_socel.infrastructure)",
  "ocelescope_module_socel.application",
  "ocelescope_module_socel.domain",
]

[[tool.importlinter.contracts]]
name = "Application and domain know no web framework, server or pydantic (plain dataclasses)"
type = "forbidden"
source_modules = ["ocelescope_module_socel.application", "ocelescope_module_socel.domain"]
forbidden_modules = ["fastapi", "ocelescope_backend", "pydantic"]
