[project]
name = "ocelescope-instance"
version = "0.1.0"
description = "An Ocelescope instance: the published backend host plus local modules"
requires-python = ">=3.13"
dependencies = [
  "ocelescope-backend>=0.10.1,<0.11.0",
  "ocelescope-module-ocel>=0.10.1,<0.11.0",
  "ocelescope-module-socel",
]

[dependency-groups]
dev = [
  "import-linter>=2.3",
  "pyright>=1.1.400",
  "ruff>=0.12",
]

# For an editor opened on the repository root. legacy/ is written against
# Ocelescope 0.8 and is not installed, so it cannot type-check here. The mode is
# set explicitly: basedpyright (Zed) otherwise switches to its strictest mode as
# soon as this section exists.
[tool.pyright]
typeCheckingMode = "standard"
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "legacy"]

[tool.uv.workspace]
members = ["backend-modules/*", "packages/*"]

[tool.uv.sources]
# Unreleased: the branch feat/ocel-extensions of promi4s/ocelescope (0.10.1 plus
# OCEL extensions - modules declare `extensions`, endpoints receive them through
# `ocel_as`). All packages from the same commit, the one the socel
# library pins too.
ocelescope = { git = "https://github.com/promi4s/ocelescope", rev = "329e57c0089703d1738761eaa7040d412dbbdd41", subdirectory = "src/ocelescope" }
ocelescope-backend = { git = "https://github.com/promi4s/ocelescope", rev = "329e57c0089703d1738761eaa7040d412dbbdd41", subdirectory = "src/backend/ocelescope-backend" }
ocelescope-module-ocel = { git = "https://github.com/promi4s/ocelescope", rev = "329e57c0089703d1738761eaa7040d412dbbdd41", subdirectory = "src/backend/modules/ocelescope-module-ocel" }
ocelescope-module-socel = { workspace = true }
socel = { workspace = true }
