[project]
name = "ocelescope-instance"
version = "0.1.0"
description = "An Ocelescope instance: the published backend host plus local modules"
requires-python = ">=3.11"
dependencies = [
  "ocelescope-backend>=0.8.0,<0.9.0",
  "ocelescope-module-ocel>=0.8.0,<0.9.0",
  "ocelescope-module-socel",
]

[dependency-groups]
dev = [
  "import-linter>=2.3",
  "pyright>=1.1.400",
  "ruff>=0.12",
]

[tool.uv.workspace]
members = ["backend-modules/*", "packages/*"]

[tool.uv.sources]
# Unreleased, until a release includes them: the OCEL extension tables
# (promi4s/ocelescope#458, every further table of an SQLite log is read) and
# resources declared by modules (#459). Both packages from the same commit.
ocelescope = { git = "https://github.com/promi4s/ocelescope", rev = "f3964a14d052c2e030609dff15d7ab29ea506e55", subdirectory = "src/ocelescope" }
ocelescope-backend = { git = "https://github.com/promi4s/ocelescope", rev = "f3964a14d052c2e030609dff15d7ab29ea506e55", subdirectory = "src/backend/ocelescope-backend" }
ocelescope-module-socel = { workspace = true }
socel = { workspace = true }
