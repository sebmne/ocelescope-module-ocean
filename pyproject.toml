[project]
name = "ocelescope-instance"
version = "0.1.0"
description = "An Ocelescope instance: the published backend host plus local modules"
requires-python = ">=3.13"
dependencies = [
  "ocelescope-backend>=0.10.1,<0.11.0",
  "ocelescope-module-ocel>=0.10.1,<0.11.0",
  "ocelescope-module-socel",
]

[dependency-groups]
dev = [
  "import-linter>=2.3",
  "pyright>=1.1.400",
  "ruff>=0.12",
]

[tool.uv.workspace]
members = ["backend-modules/*", "packages/*"]

[tool.uv.sources]
# Unreleased: the branch feat/ocel-extensions of promi4s/ocelescope (0.10.1 plus
# OCEL extensions - modules declare `extensions`, endpoints receive them through
# `get_ocel_extension`). All packages from the same commit, the one the socel
# library pins too.
ocelescope = { git = "https://github.com/promi4s/ocelescope", rev = "71df44d0c5aff3fac9f8d90047e1b6172e01901c", subdirectory = "src/ocelescope" }
ocelescope-backend = { git = "https://github.com/promi4s/ocelescope", rev = "71df44d0c5aff3fac9f8d90047e1b6172e01901c", subdirectory = "src/backend/ocelescope-backend" }
ocelescope-module-ocel = { git = "https://github.com/promi4s/ocelescope", rev = "71df44d0c5aff3fac9f8d90047e1b6172e01901c", subdirectory = "src/backend/modules/ocelescope-module-ocel" }
ocelescope-module-socel = { workspace = true }
socel = { workspace = true }
